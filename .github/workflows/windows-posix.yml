name: Windows POSIX contracts
on:
  pull_request:
  push:
    branches: ['bugfix/fix-292-windows-*', ea]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-core-${{ matrix.java }}
          path: target/surefire-reports
  windows-ffm:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['22', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B clean install
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: mvn -B -f posix-ffm/pom.xml clean verify
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify Java 8 isolation with the modern jar present
        shell: pwsh
        run: |
          mvn -q dependency:build-classpath -Dmdep.outputFile=target/provider-classpath.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $modernJar = (Get-ChildItem posix-ffm/target/posix-ffm-*.jar | Select-Object -First 1).FullName
          $cp = 'target/classes;target/test-classes;' + $modernJar + ';' + (Get-Content target/provider-classpath.txt -Raw).Trim()
          java -cp $cp net.openhft.posix.WindowsProviderProbe auto WinJNRPosixAPI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $cp net.openhft.posix.WindowsProviderProbe ffm unavailable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-ffm-${{ matrix.java }}
          path: posix-ffm/target/surefire-reports
  unix-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unix-${{ matrix.os }}
          path: target/surefire-reports

