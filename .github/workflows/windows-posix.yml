name: Windows POSIX contracts
on:
  pull_request:
  push:
    branches: ['bugfix/fix-292-windows-*', ea]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '11', '17', '21', '25']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-core-${{ matrix.java }}
          path: target/surefire-reports
  windows-ffm:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['22', '25']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      - run: mvn -B clean install
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - run: mvn -B -f posix-ffm/pom.xml clean verify
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Verify Java 8 isolation with the modern jar present
        shell: pwsh
        run: |
          mvn -q dependency:build-classpath '-Dmdep.outputFile=target/provider-classpath.txt'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $modernJar = (Get-ChildItem posix-ffm/target/posix-ffm-*.jar | Select-Object -First 1).FullName
          $cp = 'target/classes;target/test-classes;' + $modernJar + ';' + (Get-Content target/provider-classpath.txt -Raw).Trim()
          java -cp $cp net.openhft.posix.WindowsProviderProbe auto WinJNRPosixAPI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          java -cp $cp net.openhft.posix.WindowsProviderProbe ffm unavailable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-ffm-${{ matrix.java }}
          path: posix-ffm/target/surefire-reports
  unix-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: unix-${{ matrix.os }}
          path: target/surefire-reports

  benchmark-discovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B clean install
      - run: mvn -B -f posix-ffm/pom.xml clean install
      - run: mvn -B -f benchmarks/pom.xml clean package
      - run: java -jar benchmarks/target/benchmarks.jar -l
      - run: java -jar benchmarks/target/benchmarks.jar -p provider=unix-jnr -wi 0 -i 1 -r 100ms -f 1 -foe true
